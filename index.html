<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tepa_Clone</title>
    <link rel="shortcut icon" href="./logo.png" type="image/x-icon">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            /* Prevent pull-to-refresh on mobile */
            overscroll-behavior-y: contain; 
            user-select: none;
        }

        .game-board {
            background-color: #bbada0;
            touch-action: none; /* Better touch handling for the grid */
        }

        .grid-cell {
            background-color: rgba(238, 228, 218, 0.35);
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0.5;
            }
            80% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .animate-pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Highlight for selected cell (Tap-to-move support) */
        .selected-cell {
            box-shadow: inset 0 0 0 4px #8b5cf6 !important;
            background-color: rgba(139, 92, 246, 0.2) !important;
        }
        
        .level-badge {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header Section -->
    <div class="w-full max-w-md flex justify-between items-end mb-6">
        <div>
            <h1 class="text-3xl sm:text-4xl font-black text-gray-800 leading-tight">Тёпа</h1>
            <h2 class="text-xl sm:text-2xl font-bold text-purple-600 uppercase tracking-wider">Скрещивание</h2>
        </div>
        <div class="bg-gray-800 text-white px-6 py-2 rounded-xl shadow-lg text-center">
            <div class="text-xs text-gray-300 uppercase font-bold tracking-wider">Счет</div>
            <div id="score" class="text-2xl font-bold leading-none">0</div>
        </div>
    </div>

    <!-- Info Text -->
    <p class="text-gray-600 mb-6 text-center max-w-md text-sm sm:text-base font-semibold">
        Перетаскивай одинаковых котов друг на друга, чтобы получить нового! (Или просто нажимай на них).
    </p>

    <!-- Game Board -->
    <div id="grid" class="game-board grid grid-cols-4 gap-2 sm:gap-3 p-2 sm:p-3 rounded-2xl shadow-xl w-full max-w-[400px] aspect-square mb-8">
        <!-- Cells will be generated by JS -->
    </div>

    <!-- Controls -->
    <button id="add-btn" class="bg-purple-500 hover:bg-purple-600 text-white px-8 py-4 rounded-full font-bold text-lg shadow-lg shadow-purple-500/30 transition-all transform hover:-translate-y-1 active:translate-y-0 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:-translate-y-0 disabled:shadow-none flex items-center justify-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Добавить кота
    </button>

<script>
    // Game configuration and images array
    const score_sound = new Audio('./sound-buy.mp3');
    score_sound.volume = 1.0;
    const IMAGES = [
        'Тёпа в коробке.jpg',                       // Уровень 1
        'Пацан.jpg',                                // Уровень 2
        'Доча.jpg',                                 // Уровень 3
        'Пацанчик С Пистолетиком-Без Фона.jpg',     // Уровень 4
        'Банда Кошаков Тырит Конфеты 2.png',        // Уровень 5
        'Банда Кошаков Тырит Конфеты 3.png',        // Уровень 6
        'Банда Кошаков После Магазина.png',         // Уровень 7
        'Отдых У Кошаков.png',                      // Уровень 8
        'Банда Кошаков В Школе.png'                 // Уровень 9
    ];
    
    const MAX_LEVEL = 9;
    let score = 0;
    
    // DOM Elements
    const gridEl = document.getElementById('grid');
    const scoreEl = document.getElementById('score');
    const addBtn = document.getElementById('add-btn');
    
    // State
    const cells = [];
    let draggedItem = null;
    let draggedFromIndex = null;
    let selectedCellIndex = null; // For Tap-to-Move mechanics

    function initGame() {
        // Create 16 cells
        for (let i = 0; i < 16; i++) {
            const cell = document.createElement('div');
            cell.className = 'grid-cell rounded-xl sm:rounded-2xl relative flex items-center justify-center overflow-hidden cursor-pointer transition-colors duration-200';
            cell.dataset.index = i;
            
            // Event listeners for Drag & Drop
            cell.addEventListener('dragover', handleDragOver);
            cell.addEventListener('dragenter', handleDragEnter);
            cell.addEventListener('drop', handleDrop);
            
            // Event listener for Tap/Click mechanics
            cell.addEventListener('click', handleCellClick);
            
            gridEl.appendChild(cell);
            cells.push(cell);
        }

        // Add 2 initial cats
        addCat(1, true);
        addCat(1, true);
        
        updateButtonState();
    }

    function getEmptyCells() {
        return cells.filter(cell => !cell.hasChildNodes());
    }

    function addCat(level = 1, force = false) {
        const emptyCells = getEmptyCells();
        if (emptyCells.length === 0) return;
        
        const randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        createCatElement(randomCell, level);
        
        if (!force) updateButtonState();
    }

    function createCatElement(container, level) {
        const imgContainer = document.createElement('div');
        imgContainer.className = 'w-full h-full relative group animate-pop';
        imgContainer.dataset.level = level;
        imgContainer.draggable = true;

        // The image itself
        const img = document.createElement('img');
        img.src = IMAGES[level - 1];
        img.alt = `Кот уровня ${level}`;
        img.className = 'w-full h-full object-cover rounded-xl sm:rounded-2xl shadow-sm pointer-events-none';
        
        // Level Badge
        const badge = document.createElement('div');
        badge.className = 'level-badge absolute bottom-1 right-1 bg-black/60 text-white text-xs sm:text-sm font-bold px-2 py-0.5 rounded-full pointer-events-none';
        badge.innerText = `Ур. ${level}`;

        imgContainer.appendChild(img);
        imgContainer.appendChild(badge);

        // Drag events attached to the item
        imgContainer.addEventListener('dragstart', handleDragStart);
        imgContainer.addEventListener('dragend', handleDragEnd);

        container.appendChild(imgContainer);
    }

    function handleCellClick(e) {
        const clickedCell = e.currentTarget;
        const clickedIndex = clickedCell.dataset.index;
        const clickedItem = clickedCell.querySelector('div[data-level]');

        // If something is already selected
        if (selectedCellIndex !== null) {
            if (selectedCellIndex === clickedIndex) {
                // Clicked the same cell -> Deselect
                clearSelection();
                return;
            }

            const sourceCell = cells[selectedCellIndex];
            const sourceItem = sourceCell.querySelector('div[data-level]');

            if (!sourceItem) {
                clearSelection();
                return;
            }

            processMoveOrMerge(sourceCell, sourceItem, clickedCell, clickedItem);
            clearSelection();
        } else {
            // Nothing selected -> Select this cell if it has an item
            if (clickedItem) {
                selectedCellIndex = clickedIndex;
                clickedCell.classList.add('selected-cell');
            }
        }
    }

    function clearSelection() {
        if (selectedCellIndex !== null) {
            cells[selectedCellIndex].classList.remove('selected-cell');
            selectedCellIndex = null;
        }
    }

    function handleDragStart(e) {
        clearSelection(); // Clear tap selection if user starts dragging
        draggedItem = this;
        draggedFromIndex = this.parentElement.dataset.index;
        
        // Slight delay to allow visual drag image generation before modifying opacity
        setTimeout(() => {
            this.classList.add('opacity-30');
        }, 0);
    }

    function handleDragEnd(e) {
        if (draggedItem) {
            draggedItem.classList.remove('opacity-30');
        }
        draggedItem = null;
        draggedFromIndex = null;
    }

    function handleDragOver(e) {
        e.preventDefault(); // Necessary to allow dropping
    }

    function handleDragEnter(e) {
        e.preventDefault();
    }

    function handleDrop(e) {
        e.preventDefault();
        
        const targetCell = this.closest('.grid-cell');
        if (!targetCell || !draggedItem) return;

        const targetIndex = targetCell.dataset.index;
        
        if (targetIndex === draggedFromIndex) return; // Dropped on itself

        const sourceCell = cells[draggedFromIndex];
        const targetItem = targetCell.querySelector('div[data-level]');

        processMoveOrMerge(sourceCell, draggedItem, targetCell, targetItem);
        
        // Remove drag opacity class early for smoother transition
        draggedItem.classList.remove('opacity-30');
    }

    function processMoveOrMerge(sourceCell, sourceItem, targetCell, targetItem) {
        if (!targetItem) {
            // Move: Target is empty
            targetCell.appendChild(sourceItem);
        } else {
            // Merge or Swap
            const sourceLevel = parseInt(sourceItem.dataset.level);
            const targetLevel = parseInt(targetItem.dataset.level);

            if (sourceLevel === targetLevel && sourceLevel < MAX_LEVEL) {
                // Merge logic
                score_sound.currentTime = 1.0;
                score_sound.play();
                const newLevel = sourceLevel + 1;
                score += sourceLevel * 10;
                updateScore();
                
                // Remove both old items
                targetItem.remove();
                sourceItem.remove();
                
                // Create new higher level item
                createCatElement(targetCell, newLevel);
            } else {
                // Swap logic if different levels or max level reached
                sourceCell.appendChild(targetItem);
                targetCell.appendChild(sourceItem);
            }
        }
        updateButtonState();
    }

    function updateScore() {
        // Simple scale animation for score
        scoreEl.innerText = score;
        scoreEl.parentElement.classList.add('scale-110', 'text-purple-400');
        setTimeout(() => {
            scoreEl.parentElement.classList.remove('scale-110', 'text-purple-400');
            scoreEl.parentElement.classList.add('transition-transform', 'duration-200');
        }, 150);
    }

    function updateButtonState() {
        const emptyCellsCount = getEmptyCells().length;
        if (emptyCellsCount === 0) {
            addBtn.disabled = true;
            addBtn.innerHTML = `Поле заполнено`;
        } else {
            addBtn.disabled = false;
            addBtn.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Добавить кота
            `;
        }
    }

    // Event listeners
    addBtn.addEventListener('click', () => addCat(1, false));

    // Start game
    document.addEventListener('DOMContentLoaded', initGame);

</script>
</body>
</html>
